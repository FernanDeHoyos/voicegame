services:
  - type: web
    name: voicegame-dev-online
    runtime: node
    plan: free
    branch: dev-online
    buildCommand: npm ci
    startCommand: npm run start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: voicegame-dev-db
          property: connectionString
      - key: PGSSLMODE
        value: require
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: voicegame-dev
      - key: WEB_ORIGINS
        sync: false

databases:
  - name: voicegame-dev-db
    databaseName: voicegame_dev
    user: voicegame_dev
    plan: free
    postgresMajorVersion: "16"
